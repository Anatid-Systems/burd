[project]
name = "burd"
version = "0.1.0"
description = "Helpers for FalconPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crowdstrike-falconpy>=1.6.1",
    "jupyterlab>=4.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burd"]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
